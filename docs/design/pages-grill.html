<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footprint Pages Grill</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Prototype only. Question: how do /check, /results, /sources and /progress pick up the Waterline home screen?
   Shell classes are prefixed per variant (q-, r-, s-, u-). Page content (p-) is themed only through the variables a shell sets. */
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:#2a2d2c;color:#eee;font-family:system-ui,sans-serif;line-height:1.5}
.ctl{position:sticky;top:0;z-index:9;background:#111;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.ctl span{display:flex;gap:4px;flex-wrap:wrap}
.ctl button{font:inherit;background:transparent;color:#eee;border:1px solid #666;border-radius:4px;padding:4px 9px;cursor:pointer}
.ctl button[aria-pressed=true]{background:#eee;color:#111}
.belief{background:#1b1d1c;border-bottom:1px solid #444;padding:8px 12px;font-size:13px;margin:0}
.stage{padding:16px}
.frame{container-type:inline-size;margin:0 auto;overflow:hidden;font-family:"Atkinson Hyperlegible Next",system-ui,sans-serif;
  --salt:#f5f6f3;--ink:#1c2422;--muted:#55615d;--line:#d5dad5;--accent:#b0305f;--lake:#1d5a6a;--sage:#4a6636;--sun:#9b5f00;--haze:#5b4a9e;--bad:#a3262a}
.frame a{color:inherit}
.sk{display:inline-block;height:.8em;border-radius:3px;background:currentColor;opacity:.16}
.wave{display:block;width:200%;height:.75rem;fill:var(--lake)}
@media (prefers-reduced-motion:no-preference){.wave{animation:wv 9s linear infinite}}
@keyframes wv{to{transform:translateX(-50%)}}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:.8rem 1rem;font-size:.85rem}
.top b{font-family:Overpass;font-weight:800;font-size:1.05rem}

/* page content, themed by --fg --sub --rule --field --btn --btnfg */
.p-kick{font-size:.85rem;font-weight:600;color:var(--sub);margin:0}
.p-h1{font-family:Overpass;font-weight:800;font-size:clamp(1.7rem,7cqw,3rem);line-height:1.05;letter-spacing:-.01em;margin:.3rem 0 0;color:var(--fg)}
.p-help{color:var(--sub);margin:.5rem 0 0;max-width:36em}
.p-field{display:block;margin-top:1.2rem;font:inherit;font-family:Overpass;font-weight:800;font-size:1.8rem;width:9rem;padding:.5rem .8rem;border:2px solid var(--fg);border-radius:3px;background:var(--field);color:var(--ink)}
.p-err{color:var(--err);font-weight:600;margin:.6rem 0 0}
.p-acts{display:flex;gap:1rem;align-items:center;margin-top:1.5rem}
.p-btn{background:var(--btn);color:var(--btnfg);font-family:Overpass;font-weight:800;padding:.75rem 1.2rem;border-radius:3px;border:0;font-size:1rem}
.p-back{font-size:.9rem;text-decoration:underline;color:var(--fg)}
.p-nums{display:grid;gap:1.2rem;margin-top:1.5rem}
.p-num{border-top:4px solid var(--fg);padding-top:.6rem;color:var(--fg)}
.p-num i{font-style:normal;font-weight:600;font-size:.85rem}
.p-num b{display:block;font-family:Overpass;font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.p-num span{font-size:.9rem;color:var(--sub)}
@container (min-width:1000px){.p-nums{grid-template-columns:repeat(3,1fr);gap:2.5rem}.top{padding:1rem 3rem}}

/* Q: quiet */
.vq{background:var(--salt);color:var(--ink);min-height:var(--h);--fg:var(--ink);--sub:var(--muted);--field:#fff;--btn:var(--accent);--btnfg:#fff;--err:var(--bad)}
.q-top{border-bottom:1px solid var(--line)}
.q-bar{height:.4rem;background:var(--line);margin-bottom:1.5rem}.q-bar i{display:block;height:100%;background:var(--ink)}
.q-main{padding:1.5rem 1rem;max-width:46rem;margin:0 auto}
@container (min-width:1000px){.q-main{padding:3rem}}

/* R: rail */
.vr{background:var(--salt);color:var(--ink);min-height:var(--h);display:flex;flex-direction:column;--fg:var(--ink);--sub:var(--muted);--field:#fff;--btn:var(--accent);--btnfg:#fff;--err:var(--bad)}
.r-top{padding-left:5rem!important}
.r-body{flex:1;display:flex}
.r-rail{overflow:hidden;width:4rem;flex:none;border-right:2px solid var(--ink);position:relative;display:flex;flex-direction:column-reverse}
.r-fill{background:var(--lake);position:relative}
.r-fill svg{position:absolute;bottom:100%;left:0;margin-bottom:-1px;width:150rem}
.r-tick{position:absolute;right:.4rem;font-family:Overpass;font-weight:600;font-size:.8rem;transform:translateY(50%)}
.r-main{flex:1;min-width:0;padding:1.5rem 1rem 2rem}
@container (min-width:1000px){.r-top{padding-left:11rem!important}.r-rail{width:8rem}.r-main{padding:3rem}}

/* S: surface */
.vs{background:var(--salt);color:var(--ink);min-height:var(--h);--fg:var(--ink);--sub:var(--muted);--field:#fff;--btn:var(--accent);--btnfg:#fff;--err:var(--bad)}
.s-water{background:var(--lake);color:var(--salt);--fg:var(--salt);--sub:#d3e3e6}
.s-head{padding:.5rem 1rem 1.5rem;max-width:60rem}
.s-edge{overflow:hidden;transform:scaleY(-1);margin-top:-1px}
.s-steps{display:flex;gap:.3rem;margin-top:1rem}.s-steps i{height:.35rem;flex:1;background:var(--salt);opacity:.3}.s-steps i.on{opacity:1}
.s-main{padding:1rem 1rem 2rem;max-width:60rem}
@container (min-width:1000px){.s-head{padding:1rem 3rem 2rem}.s-main{padding:1.5rem 3rem 3rem}}

/* U: under water */
.vu{background:var(--lake);color:var(--salt);min-height:var(--h);--fg:var(--salt);--sub:#d3e3e6;--field:var(--salt);--btn:var(--salt);--btnfg:var(--ink);--err:#ffd9a8}
.u-surface{background:var(--salt);color:var(--ink);overflow:hidden}
.u-surface .wave{margin-top:.2rem;margin-bottom:-1px}
.u-main{padding:1.5rem 1rem 2rem;max-width:60rem}
.u-depth{font-family:Overpass;font-weight:600;font-size:.85rem;opacity:.8;margin:0 0 1rem}
@container (min-width:1000px){.u-main{padding:2.5rem 3rem}}
</style>

<div class="ctl"><span id="vp"></span><span id="pp"></span><span id="sp"></span><span id="wp"></span></div>
<p class="belief" id="belief"></p>
<div class="stage"><div class="frame" id="frame"></div></div>

<script>
const WAVE = `<svg class="wave" viewBox="0 0 2400 12" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6${" q30 -6 60 0 t60 0".repeat(20)} V12 H0 Z"/></svg>`;
const sk = w => `<span class="sk" style="width:${w}"></span>`;
// Inline fixture: copy from the app; numbers are the sample home on /results.
function page(pg, st) {
  const L = st === "loading";
  if (pg === "check") {
    const long = st === "long";
    return { step: long ? 3 : 1, of: 6,
      kick: long ? "Pregunta 3 de 6" : "Question 1 of 6",
      title: L ? sk("9em") : long ? "¿Cuántos pies cuadrados de césped riega en su casa, aproximadamente?" : "What is your ZIP code?",
      body: `<p class="p-help">${L ? sk("14em") : long ? "Una estimación aproximada está bien. Un patio trasero típico de Salt Lake City tiene entre 1,000 y 3,000 pies cuadrados de césped; cuente solo la parte que riega." : "We use it for the air where you live."}</p>
        <input class="p-field" aria-label="answer" placeholder="${long ? "1800" : "84116"}" value="${st === "ok" ? "84116" : st === "error" ? "8411" : ""}">
        ${st === "error" ? `<p class="p-err">▲ Enter a 5-digit Utah ZIP code, like 84116.</p>` : ""}
        <div class="p-acts">${long ? `<a class="p-back" href="#">Atrás</a>` : ""}<button class="p-btn">${long ? "Siguiente" : "Next"} →</button></div>` };
  }
  const nums = [["Water", "106,000", "gallons a year"], ["Energy", "20,400", "lbs CO2 a year"], ["Air", "2,650", "lbs of CO2 a year from the commute"]];
  return { step: 6, of: 6, kick: st === "empty" ? "No answers yet" : "Sample home",
    title: L ? sk("12em") : st === "empty" ? "Answer six questions to see your footprint." : st === "long" ? "Marisol Vega and family, Rose Park neighborhood, Salt Lake City, Utah 84116" : "Marisol Vega, Rose Park, Salt Lake City",
    body: st === "empty" ? `<div class="p-acts"><button class="p-btn">Check my home →</button></div>`
      : st === "error" ? `<p class="p-err">▲ We could not load the saved answers on this device. Showing the sample home.</p>`
      : `<p class="p-help">4 people, 1,800 square feet of lawn, 6 miles to work one way, heated with natural gas. These are estimates from those answers, not meter readings.</p>
        <div class="p-nums">${nums.map(n => `<div class="p-num"><i>${n[0]}</i><b>${L ? sk("3em") : n[1]}</b><span>${n[2]}</span></div>`).join("")}</div>` };
}
const hdr = cls => `<header class="top ${cls}"><b>EcoSwitch</b><a href="#">Sources</a></header>`;
const V = {
  q: { name: "Q Quiet (today)", belief: "Q believes the home screen should be the only loud one: the other pages stay plain salt and ink, so the lake moment is not diluted. This is what is live now.",
    render: p => `<div class="vq">${hdr("q-top")}<main class="q-main"><div class="q-bar"><i style="width:${p.step / p.of * 100}%"></i></div><p class="p-kick">${p.kick}</p><h1 class="p-h1">${p.title}</h1>${p.body}</main></div>` },
  r: { name: "R Rail", belief: "R believes the gauge is the brand: the scale rail from the home screen runs down every page, and on the check it is the progress bar, filling with water as questions are answered.",
    render: p => `<div class="vr">${hdr("r-top")}<div class="r-body"><div class="r-rail" aria-hidden="true"><div class="r-fill" style="height:${p.step / p.of * 100}%">${WAVE}</div>${[1, 2, 3, 4, 5, 6].map(n => `<span class="r-tick" style="bottom:${n / 6 * 100}%;${n <= p.step ? "color:var(--salt)" : ""}">${n}</span>`).join("")}</div>
      <main class="r-main"><p class="p-kick">${p.kick}</p><h1 class="p-h1">${p.title}</h1>${p.body}</main></div></div>` },
  s: { name: "S Surface", belief: "S believes every page should start in the lake: the title sits in a band of water with the wave as its lower edge, and the work happens on salt below it.",
    render: p => `<div class="vs"><div class="s-water">${hdr("")}<div class="s-head"><p class="p-kick">${p.kick}</p><h1 class="p-h1">${p.title}</h1><div class="s-steps" aria-hidden="true">${[1, 2, 3, 4, 5, 6].map(n => `<i class="${n <= p.step ? "on" : ""}"></i>`).join("")}</div></div></div><div class="s-edge" aria-hidden="true">${WAVE}</div>
      <main class="s-main">${p.body}</main></div>` },
  u: { name: "U Under water", belief: "U believes the home screen's waterline is a threshold: once you tap Check my home you are below it, so every other page is white on lake teal. The one to argue with.",
    render: p => `<div class="vu"><div class="u-surface">${hdr("")}${WAVE}</div><main class="u-main"><p class="u-depth">${p.kick}</p><h1 class="p-h1">${p.title}</h1>${p.body}</main></div>` }
};
const PAGES = { check: "/check", results: "/results (top)" };
const STATES = { empty: "Empty", ok: "Normal", loading: "Loading", error: "Error", long: "Too much" };
const WIDTHS = { 390: "Phone 390×844", 1440: "Laptop 1440×900" };
const s = { v: "q", pg: "check", st: "ok", w: innerWidth < 900 ? "390" : "1440" };
function group(el, key, opts) {
  el.innerHTML = Object.entries(opts).map(([k, n]) => `<button data-k="${k}" aria-pressed="${s[key] == k}">${n}</button>`).join("");
  el.onclick = e => { const k = e.target.dataset.k; if (k) { s[key] = k; draw(); } };
}
function draw() {
  group(vp, "v", Object.fromEntries(Object.entries(V).map(([k, v]) => [k, v.name])));
  group(pp, "pg", PAGES); group(sp, "st", STATES); group(wp, "w", WIDTHS);
  const w = +s.w, f = document.getElementById("frame");
  document.documentElement.style.fontSize = w > 1000 ? "20px" : "17px";
  f.style.width = w + "px"; f.style.setProperty("--h", (w > 1000 ? 900 : 844) + "px");
  f.style.zoom = Math.min(1, (innerWidth - 32) / w);
  belief.textContent = V[s.v].belief;
  f.innerHTML = V[s.v].render(page(s.pg, s.st));
}
addEventListener("resize", draw); draw();
</script>
</html>
